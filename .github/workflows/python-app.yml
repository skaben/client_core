name: "[CI] test, build, push"

on:
  workflow_dispatch:
  push:
    branches:
      - "release/*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f build_requirements.txt ]; then pip install -r build_requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./skabenclient --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest ./skabenclient

    - name: Build and upload package
      run: |
        python setup.py sdist
        curl -F package=@dist/*.tar.gz https://${{ secrets.GEMFIRE_PUSH }}@push.fury.io/zerthmonk/
